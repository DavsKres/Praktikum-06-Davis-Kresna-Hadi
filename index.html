<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>     
<body>
    
    <h1>Ini Belajar js</h1>

    <script>
        //kode js

        const name="Nurul Fikri";
        let umur=20;
        let nilai=100;
        let aktif="true";

        console.log("Nama", name);
        console.log("Umur", umur);
        console.log("Nilai", nilai);
        console.log("Aktif", aktif);
        console.log("tipe nilai", typeof nilai);

        const tugas = 80;
        const uts = 70;
        const uas = 90;
        const akhir = tugas * 0.30 + uts * 0.30 + uas * 0.40;

        console.log("Nilai Akhir:", akhir);
        console.log("Lulus:", akhir >= 60);

        // percabangan if else
        const nilai2 = 78;
        let kategori;
        
        if (nilai2 >=85 ) {
            kategori = "A";
        } else if (nilai2 >= 70) {
            kategori = "B"
        } else if (nilai2 >= 60) {
            kategori = "C"
        } else {
            kategori = "D"
        }

        console.log("nilai", nilai2);
        console.log("Kategori:", kategori);

        //perulangan dan fungsi dasar
        function hitunganDiskon(harga, persen) {
            return harga - (harga * persen / 100);
        }

        for (let i = 1;i <= 3; i++) {
            const harga = 100000;
            const persen = i * 10;
            const hargaDiskon = hitunganDiskon(harga, persen);
            console.log(`Harga setelah diskon ${persen}%: ${hargaDiskon}`);
        }
        
    </script>

</body>
</html>
